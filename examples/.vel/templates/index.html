<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>

    <!-- Teloce CDN -->
    <script src="https://cdn.jsdelivr.net/npm/teloce@0.3.0/dist/teloce.global.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

    <!-- Pass data from Flask to JavaScript -->
    <script>
        window.__INITIAL_STATE__ = {
            products: {{ products|tojson }},
            categories: {{ categories|tojson }}
        };
    </script>
</head>
<body>
    <div id="app">
        <!-- Main App Component will be mounted here -->
        <app-dashboard />
    </div>

    <!-- Compiled .vel components -->
    <script type="module">
        // Import compiled .vel components (built by CLI)
        import AppDashboard from '/static/js/app.js';

        // Register components globally
        const app = teloce.createApp('#app', {
            components: {
                'app-dashboard': AppDashboard
            }
        });

        console.log('🚀 Teloce .vel Example initialized!');
    </script>
</body>
</html>
