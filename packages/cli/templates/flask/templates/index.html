<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <!-- Teloce CDN -->
    <script src="https://cdn.teloce.dev/teloce.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .counter {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .counter-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s ease;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        .items {
            margin-top: 20px;
            text-align: left;
        }
        .items-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .items ul {
            list-style: none;
            padding: 0;
        }
        .items li {
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .items li:hover {
            background: #edf2f7;
            transform: translateX(5px);
        }
        .badge {
            background: #667eea;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 12px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #48bb78;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="logo">🚀</div>
        <h1>Hello {{ name }}</h1>
        <p class="subtitle">Flask + Teloce is running!</p>
        
        <div class="status">● Live</div>
        
        <div class="counter">
            <div class="counter-number">{{ count }}</div>
            <p style="color: #888; font-size: 14px;">Count</p>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" @click="increment">+ Increment</button>
            <button class="btn btn-secondary" @click="decrement">- Decrement</button>
            <button class="btn btn-success" @click="reset">⟳ Reset</button>
        </div>
        
        <div class="items">
            <div class="items-title">📋 Items ({{ items.length }})</div>
            <ul>
                <for key="id" item="item" in="items">
                    <li>
                        <span>{{ item }}</span>
                        <span class="badge">#{{ index + 1 }}</span>
                    </li>
                </for>
            </ul>
        </div>
        
        <div class="footer">
            Built with ❤️ using <a href="https://teloce.dev" target="_blank">Teloce</a> and Flask
            <br>
            {{ year }}
        </div>
    </div>
    
    <script>
        // Initialize Teloce with data from Flask
        const app = teloce.createApp('#app', {
            name: '{{ name }}',
            count: 0,
            items: ['Item 1', 'Item 2', 'Item 3'],
            
            // Methods
            increment() {
                this.count++;
            },
            decrement() {
                if (this.count > 0) this.count--;
            },
            reset() {
                this.count = 0;
            },
            
            // Computed properties
            computed: {
                doubleCount() {
                    return this.count * 2;
                }
            }
        });
        
        // Example: Fetch data from Flask API
        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                console.log('Data from Flask:', data);
                // Update Teloce state
                app.state.items = data.items;
            } catch (error) {
                console.error('Failed to fetch data:', error);
            }
        }
        
        // Fetch data on load
        fetchData();
        
        // Log initial state
        console.log('🚀 Teloce + Flask app initialized!');
        console.log('State:', app.state);
    </script>
</body>
</html>
