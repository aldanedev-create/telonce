<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <!-- Teloce CDN -->
    <script src="https://cdn.teloce.dev/teloce.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .badge-lightweight {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #fcb69f;
            color: white;
            margin-top: 10px;
        }
        .counter {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .counter-number {
            font-size: 48px;
            font-weight: bold;
            color: #fcb69f;
            transition: all 0.3s ease;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary {
            background: #fcb69f;
            color: white;
        }
        .btn-primary:hover {
            background: #f5a080;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        .btn-info {
            background: #63b3ed;
            color: white;
        }
        .btn-info:hover {
            background: #4299e1;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 12px;
        }
        .footer a {
            color: #fcb69f;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .features {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .feature-tag {
            padding: 5px 15px;
            background: #f8f9fa;
            border-radius: 20px;
            font-size: 12px;
            color: #666;
            border: 1px solid #e2e8f0;
        }
        .feature-tag:hover {
            background: #edf2f7;
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .message {
            margin-top: 15px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 12px;
            border-left: 4px solid #fcb69f;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="logo">🚀</div>
        <h1>Hello {{ name }}</h1>
        <p class="subtitle">Flaxon + Teloce is running!</p>
        
        <div>
            <span class="badge-lightweight">⚡ Lightweight</span>
            <span class="badge-lightweight" style="background: #63b3ed; margin-left: 5px;">Flaxon</span>
        </div>
        
        <div class="features">
            <span class="feature-tag">📦 Simple</span>
            <span class="feature-tag">⚡ Fast</span>
            <span class="feature-tag">🔄 Reactive</span>
            <span class="feature-tag">🐍 Python</span>
        </div>
        
        <div class="counter">
            <div class="counter-number">{{ count }}</div>
            <p style="color: #888; font-size: 14px;">Count</p>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" @click="increment">+ Increment</button>
            <button class="btn btn-secondary" @click="decrement">- Decrement</button>
            <button class="btn btn-info" @click="reset">⟳ Reset</button>
        </div>
        
        <div class="message" :show="messageVisible">
            {{ message }}
        </div>
        
        <div class="footer">
            Built with ❤️ using <a href="https://teloce.dev" target="_blank">Teloce</a> and Flaxon
            <br>
            {{ year }}
        </div>
    </div>
    
    <script>
        // Initialize Teloce with data from Flaxon
        const app = teloce.createApp('#app', {
            name: '{{ name }}',
            count: 0,
            message: '',
            messageVisible: false,
            messageTimeout: null,
            
            // Methods
            increment() {
                this.count++;
                this.showMessage('Count increased to ' + this.count);
            },
            decrement() {
                if (this.count > 0) {
                    this.count--;
                    this.showMessage('Count decreased to ' + this.count);
                }
            },
            reset() {
                this.count = 0;
                this.showMessage('Count reset to 0');
            },
            showMessage(msg) {
                this.message = msg;
                this.messageVisible = true;
                clearTimeout(this.messageTimeout);
                this.messageTimeout = setTimeout(() => {
                    this.messageVisible = false;
                }, 3000);
            }
        });
        
        console.log('🚀 Teloce + Flaxon app initialized!');
        console.log('State:', app.state);
    </script>
</body>
</html>
