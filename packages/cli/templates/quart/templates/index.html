<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    
    <!-- Teloce CDN -->
    <script src="https://cdn.teloce.dev/teloce.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .badge-async {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #f5576c;
            color: white;
            margin-top: 10px;
        }
        .counter {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .counter-number {
            font-size: 48px;
            font-weight: bold;
            color: #f5576c;
            transition: all 0.3s ease;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .btn-primary {
            background: #f5576c;
            color: white;
        }
        .btn-primary:hover {
            background: #e03a50;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #48bb78;
            color: white;
        }
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 12px;
        }
        .footer a {
            color: #f5576c;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .async-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #48bb78;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .async-label {
            color: #888;
            font-size: 12px;
        }
        .response-time {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="logo">🌀</div>
        <h1>Hello {{ name }}</h1>
        <p class="subtitle">Quart + Teloce is running!</p>
        
        <div>
            <span class="badge-async"><span class="async-indicator"></span> Async</span>
            <span class="async-label">Quart</span>
        </div>
        
        <div class="counter">
            <div class="counter-number">{{ count }}</div>
            <p style="color: #888; font-size: 14px;">Count</p>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" @click="increment">+ Increment</button>
            <button class="btn btn-secondary" @click="decrement">- Decrement</button>
            <button class="btn btn-success" @click="reset">⟳ Reset</button>
        </div>
        
        <div class="response-time">
            ⚡ Response time: {{ responseTime }}ms
        </div>
        
        <div class="footer">
            Built with ❤️ using <a href="https://teloce.dev" target="_blank">Teloce</a> and Quart
            <br>
            {{ year }}
        </div>
    </div>
    
    <script>
        // Initialize Teloce with data from Quart
        const app = teloce.createApp('#app', {
            name: '{{ name }}',
            count: 0,
            responseTime: 0,
            
            // Methods
            increment() {
                const start = performance.now();
                this.count++;
                this.responseTime = Math.round(performance.now() - start);
            },
            decrement() {
                const start = performance.now();
                if (this.count > 0) this.count--;
                this.responseTime = Math.round(performance.now() - start);
            },
            reset() {
                const start = performance.now();
                this.count = 0;
                this.responseTime = Math.round(performance.now() - start);
            }
        });
        
        // Simulate async response time
        setInterval(() => {
            app.state.responseTime = Math.round(Math.random() * 50 + 10);
        }, 3000);
        
        console.log('🚀 Teloce + Quart app initialized!');
        console.log('State:', app.state);
    </script>
</body>
</html>
