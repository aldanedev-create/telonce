<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teloce Playground</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        /* --- Reset --- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --bg-hover: #252d3f;
            --bg-active: #2d3748;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            --radius: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --header-height: 48px;
            --footer-height: 32px;
            --toolbar-height: 40px;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            overflow: hidden;
        }

        /* --- Layout --- */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--header-height);
            padding: 0 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }

        .header-brand .logo {
            font-size: 20px;
        }

        .header-brand .brand-text {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            font-family: var(--font);
        }

        .btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4a8dd6;
            border-color: #4a8dd6;
        }

        .btn-success {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }

        .btn-success:hover {
            background: #31a843;
            border-color: #31a843;
        }

        .btn-danger {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }

        .btn-danger:hover {
            background: #d43d36;
            border-color: #d43d36;
        }

        .btn-icon {
            padding: 6px 10px;
            font-size: 16px;
            line-height: 1;
        }

        /* --- Main Content --- */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Editor Panel --- */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            min-width: 0;
        }

        .editor-tabs {
            display: flex;
            align-items: center;
            height: var(--toolbar-height);
            padding: 0 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 4px;
        }

        .editor-tab {
            padding: 4px 14px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            font-family: var(--font);
        }

        .editor-tab:hover {
            color: var(--text-secondary);
            background: var(--bg-hover);
        }

        .editor-tab.active {
            color: var(--text-primary);
            background: var(--bg-active);
        }

        .editor-tab .badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            background: var(--accent-red);
            color: #fff;
            margin-left: 4px;
            display: none;
        }

        .editor-tab .badge.show {
            display: inline-block;
        }

        .editor-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .editor-container .editor-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* --- Preview Panel --- */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #fff;
        }

        .preview-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--toolbar-height);
            padding: 0 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .preview-toolbar .preview-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .preview-toolbar .preview-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .preview-toolbar .preview-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .preview-toolbar .preview-status .dot.loading {
            background: var(--accent-yellow);
            animation: pulse 1s infinite;
        }

        .preview-toolbar .preview-status .dot.success {
            background: var(--accent-green);
        }

        .preview-toolbar .preview-status .dot.error {
            background: var(--accent-red);
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .preview-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #fff;
        }

        .preview-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .preview-container .preview-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .preview-container .preview-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .preview-container .preview-overlay .error-content {
            max-width: 600px;
        }

        .preview-container .preview-overlay .error-title {
            color: var(--accent-red);
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .preview-container .preview-overlay .error-message {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .preview-container .preview-overlay .error-fix {
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border-left: 3px solid var(--accent-green);
            text-align: left;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .preview-container .preview-overlay .error-fix .label {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Status Bar --- */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--footer-height);
            padding: 0 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .status-bar .status-left {
            display: flex;
            gap: 16px;
        }

        .status-bar .status-right {
            display: flex;
            gap: 16px;
        }

        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .editor-panel {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 50vh;
            }

            .preview-panel {
                max-height: 50vh;
            }

            .header-actions .btn-text {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .header-brand .brand-text {
                display: none;
            }

            .editor-tabs {
                overflow-x: auto;
            }

            .status-bar {
                flex-wrap: wrap;
                height: auto;
                padding: 4px 12px;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <span class="logo">🚀</span>
                <span class="brand-text">Teloce Playground</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon" id="resetBtn" title="Reset to default example">⟳</button>
                <button class="btn btn-icon" id="exportBtn" title="Export as HTML">📥</button>
                <button class="btn btn-icon" id="shareBtn" title="Share">🔗</button>
                <button class="btn btn-icon" id="themeBtn" title="Toggle theme">🌓</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Editor Panel -->
            <div class="editor-panel">
                <div class="editor-tabs">
                    <button class="editor-tab active" data-tab="template">Template</button>
                    <button class="editor-tab" data-tab="script">Script</button>
                    <button class="editor-tab" data-tab="style">Style</button>
                    <button class="editor-tab" data-tab="config">Config</button>
                    <span style="flex:1;"></span>
                    <span style="font-size:12px;color:var(--text-muted);">Errors: <span id="errorCount">0</span></span>
                </div>
                <div class="editor-container" id="editorContainer">
                    <!-- Editor will be mounted here -->
                    <div class="editor-placeholder">Loading editor...</div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="preview-panel">
                <div class="preview-toolbar">
                    <span class="preview-label">Preview</span>
                    <div class="preview-status">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">Ready</span>
                    </div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                    <div class="preview-overlay" id="previewOverlay">
                        <div class="error-content">
                            <div class="error-title">❌ Error</div>
                            <div class="error-message" id="errorMessage">Something went wrong</div>
                            <div class="error-fix" id="errorFix">
                                <div class="label">💡 Suggested Fix</div>
                                <div id="errorFixText">Check your code for errors.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="status-item">📄 <span id="fileName">example.vel</span></span>
                <span class="status-item">📍 Ln <span id="lineNum">1</span>, Col <span id="colNum">1</span></span>
            </div>
            <div class="status-right">
                <span class="status-item">🔄 <span id="compileTime">0ms</span></span>
                <span class="status-item">📦 <span id="bundleSize">0 KB</span></span>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
